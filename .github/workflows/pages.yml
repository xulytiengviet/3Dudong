name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages is not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::Enable GitHub Pages once in Settings > Pages > Source: GitHub Actions, then re-run this workflow."

      - name: Upload site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
